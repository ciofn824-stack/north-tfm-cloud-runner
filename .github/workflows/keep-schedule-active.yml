name: Keep scheduled updates active

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record public-runner activity
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-schedule-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-schedule-activity.txt
          git commit -m 'Keep scheduled cloud updates active' || exit 0
          git push
